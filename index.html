<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domicile v2 - Synchronisé</title>
<link href="https://fonts.bunny.net/css?family=bebas-neue:400|dm-mono:300,400,500|inter:400,500,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1f2e;--bg2:#232a3b;--bg3:#2c3550;
  --border:#3a4560;--copper:#c8855a;--cl:#e8a882;
  --amber:#f0c060;--green:#6bbf8e;--red:#e07060;--blue:#7aadcc;
  --text:#dde3f0;--dim:#8892aa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,133,90,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,133,90,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;}
input,select{background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:9px 12px;outline:none;width:100%;transition:border-color .2s;}
input:focus,select:focus{border-color:var(--copper);}
select option{background:var(--bg3);}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(26,31,46,.99),rgba(35,42,59,.99));position:sticky;top:0;z-index:100;gap:10px;flex-wrap:wrap;}
.logo{font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:22px;letter-spacing:3px;color:var(--cl);}
.logo-sub{font-size:10px;color:var(--dim);letter-spacing:2px;margin-left:8px;}
#hdate{font-size:11px;color:var(--dim);}
.hbtn{background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--dim);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;padding:5px 9px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.hbtn:hover{border-color:var(--copper);color:var(--copper);}

/* TABS */
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{flex:1;min-width:80px;padding:12px 8px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.5px;cursor:pointer;position:relative;text-align:center;transition:color .2s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--cl);border-bottom-color:var(--copper);background:var(--bg2);}
.tbadge{position:absolute;top:5px;right:4px;background:var(--red);color:#fff;font-size:8px;font-weight:700;border-radius:8px;padding:1px 4px;line-height:1.4;display:none;}
.tbadge.show{display:block;}

/* MAIN */
main{padding:16px 18px;max-width:960px;margin:0 auto;}
.view{display:none;}
.view.on{display:block;animation:fu .2s ease;}
@keyframes fu{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:16px;margin-bottom:12px;}

/* SECTION TITLE */
.stit{font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:14px;letter-spacing:3px;color:var(--copper);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.stit::after{content:'';flex:1;height:1px;background:var(--border);}

/* STATS */
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;position:relative;overflow:hidden;}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc.r::before{background:var(--red);}
.sc.a::before{background:var(--amber);}
.sc.g::before{background:var(--green);}
.sc.b::before{background:var(--blue);}
.sc-l{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
.sc-v{font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:32px;line-height:1;letter-spacing:2px;}
.sc.r .sc-v{color:var(--red);}
.sc.a .sc-v{color:var(--amber);}
.sc.g .sc-v{color:var(--green);}
.sc.b .sc-v{color:var(--blue);}
.sc-s{font-size:9px;color:var(--dim);margin-top:2px;}

/* URGENT BANNER */
.urgbanner{background:rgba(224,112,96,.1);border:1px solid rgba(224,112,96,.3);border-radius:6px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--red);}
.urgbanner button{background:var(--red);border:none;border-radius:4px;color:#fff;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;padding:5px 10px;cursor:pointer;white-space:nowrap;}

/* TASK ITEM */
.tl{display:flex;flex-direction:column;gap:5px;}
.ti{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px 13px;display:grid;grid-template-columns:9px 1fr auto;align-items:start;gap:10px;transition:border-color .15s,background .15s;}
.ti:hover{border-color:rgba(200,133,90,.4);background:var(--bg3);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.dot.urgent{background:var(--red);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,112,96,.5);}60%{box-shadow:0 0 0 5px rgba(224,112,96,0);}}
.dot.soon{background:var(--amber);}
.dot.ok{background:var(--green);}
.dot.done{background:var(--border);}
.ti-main{min-width:0;}
.ti-name{font-size:12px;color:var(--text);line-height:1.4;word-break:break-word;}
.ti-name.dt{text-decoration:line-through;color:var(--dim);}
.ti-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center;}
.tag{font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--border);color:var(--dim);}
.date-lbl{font-size:10px;color:var(--dim);}
.date-lbl.urgent{color:var(--red);}
.date-lbl.soon{color:var(--amber);}
.rbadge{font-size:9px;padding:1px 5px;border-radius:8px;}
.rbadge.daily{background:rgba(224,112,96,.15);color:var(--red);border:1px solid rgba(224,112,96,.3);}
.rbadge.weekly{background:rgba(240,192,96,.15);color:var(--amber);border:1px solid rgba(240,192,96,.3);}
.rbadge.monthly{background:rgba(122,173,204,.15);color:var(--blue);border:1px solid rgba(122,173,204,.3);}
.rbadge.quarterly{background:rgba(200,133,90,.15);color:var(--copper);border:1px solid rgba(200,133,90,.3);}
.rbadge.yearly{background:rgba(107,191,142,.15);color:var(--green);border:1px solid rgba(107,191,142,.3);}
.ti-acts{display:flex;gap:3px;flex-shrink:0;}
.bi{background:transparent;border:1px solid var(--border);color:var(--dim);width:27px;height:27px;border-radius:4px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.bi:hover{border-color:var(--copper);color:var(--text);}
.bi.ok:hover{border-color:var(--green);color:var(--green);}
.bi.del:hover{border-color:var(--red);color:var(--red);}

/* PIECE GROUP */
.piece-group{margin-bottom:14px;}
.piece-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;user-select:none;}
.piece-icon{font-size:16px;}
.piece-name{font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:13px;letter-spacing:2px;color:var(--dim);}
.piece-count{font-size:10px;color:var(--dim);background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:1px 7px;}
.piece-hdr .chevron{font-size:9px;color:var(--dim);transition:transform .2s;margin-left:auto;}
.piece-hdr.collapsed .chevron{transform:rotate(-90deg);}
.piece-tasks{display:flex;flex-direction:column;gap:5px;}
.piece-tasks.hidden{display:none;}

/* ADD FORM */
.add-form{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:14px 16px;margin-bottom:12px;}
.add-quick{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
.add-quick input{padding:10px 12px;font-size:13px;}
.add-quick .bp{white-space:nowrap;}
.add-expand-btn{font-size:10px;color:var(--dim);background:none;border:none;cursor:pointer;padding:2px 0;text-decoration:underline;font-family:'DM Mono',monospace;}
.add-expand-btn:hover{color:var(--copper);}
.add-detail{display:none;margin-top:10px;}
.add-detail.open{display:block;}
.fgrid{display:grid;gap:8px;margin-bottom:8px;}
.fg2{grid-template-columns:1fr 1fr;}
.fg3{grid-template-columns:1fr 1fr 1fr;}
.fg4{grid-template-columns:1fr 1fr 1fr 1fr;}
.flbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px;}
.bp{background:var(--copper);border:none;border-radius:5px;color:var(--bg);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:10px 16px;cursor:pointer;transition:background .15s;}
.bp:hover{background:var(--cl);}
